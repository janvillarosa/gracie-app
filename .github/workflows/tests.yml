name: tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('backend/go.sum') }}
          restore-keys: ${{ runner.os }}-go-
      - name: Build
        working-directory: backend
        run: go build ./...
      - name: Vet
        working-directory: backend
        run: go vet ./...
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - name: Lint
        working-directory: backend
        run: golangci-lint run ./...
      - name: Unit tests + coverage
        working-directory: backend
        run: go test ./... -count=1 -covermode=atomic -coverprofile=cover.out
      - name: Coverage gate (ratchet floor 50%; raise as coverage grows)
        working-directory: backend
        run: |
          total=$(go tool cover -func=cover.out | awk '/^total:/ {print $3}' | tr -d '%')
          echo "backend total coverage: ${total}% (floor 50%)"
          awk -v t="$total" 'BEGIN { exit (t+0 < 50) ? 1 : 0 }'

  frontend:
    name: Frontend (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Verify pnpm
        run: pnpm -v
      - name: Install deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: frontend
        run: pnpm typecheck
      - name: Lint
        working-directory: frontend
        run: pnpm lint
      - name: Build
        working-directory: frontend
        run: pnpm build
      - name: Unit tests + coverage (thresholds enforced in vite.config.ts)
        working-directory: frontend
        run: pnpm test:ci

  api-integration:
    name: API + Mongo Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Start MongoDB single-node replica set
        run: |
          docker run -d --name mongo-rs -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          # wait for mongod
          for i in {1..60}; do
            if docker exec mongo-rs mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' | grep -q 1; then break; fi
            sleep 1
          done
          # initiate replica set
          docker exec mongo-rs mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          # wait for PRIMARY
          for i in {1..60}; do
            state=$(docker exec mongo-rs mongosh --quiet --eval 'rs.status().myState') || true
            if [ "$state" = "1" ]; then break; fi
            sleep 1
          done
      - name: Run Mongo-backed integration tests (build-tagged)
        env:
          MONGODB_URI: mongodb://localhost:27017/?replicaSet=rs0&retryWrites=true&w=majority
        working-directory: backend
        run: go test -tags=integration ./internal/store/mongo/... -v -count=1
      - name: Cleanup Mongo
        if: always()
        run: |
          docker logs mongo-rs || true
          docker rm -f mongo-rs || true
