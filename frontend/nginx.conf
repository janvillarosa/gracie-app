server {
  listen 80;
  server_name _;

  # Serve static files
  root /usr/share/nginx/html;
  index index.html;

  # Proxy API to backend service (same-origin, no CORS needed)
  location /api/ {
    proxy_pass http://api:8080/; # docker-compose service name
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Hashed build assets never change: cache for a year
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA fallback; index.html must revalidate so new deploys are picked up
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}

